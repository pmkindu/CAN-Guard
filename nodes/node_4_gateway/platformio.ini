; Ini

[env:esp8266_gateway]
upload_port = COM15
monitor_port = COM15
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515 @ ^1.2.1
    adafruit/Adafruit SH110X @ ^2.1.10
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:native]
platform = native