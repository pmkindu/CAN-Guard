; Ini

[env:node_3_nano]
upload_port = COM13
monitor_port = COM13
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515 @ ^1.2.1
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit NeoPixel @ ^1.12.3